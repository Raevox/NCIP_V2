<!DOCTYPE html>
<html>
<head>
    <title>Notifications Debug - Database & API Test</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        button { margin: 10px 5px 10px 0; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 Notifications Debug Panel</h1>
    
    <div class="section">
        <h2>1. Database Direct Query</h2>
        <button onclick="testDatabaseQuery()">📊 Test Database Query</button>
        <div id="dbResult"></div>
    </div>
    
    <div class="section">
        <h2>2. API Endpoint Test</h2>
        <button onclick="testAPI()">🌐 Test /api/admin/notifications</button>
        <div id="apiResult"></div>
    </div>
    
    <div class="section">
        <h2>3. View Laravel Logs</h2>
        <button onclick="viewLogs()">📋 Show Recent Logs</button>
        <div id="logsResult"></div>
    </div>
    
    <div class="section">
        <h2>4. Table Info</h2>
        <button onclick="getTableInfo()">ℹ️ Get Table Structure</button>
        <div id="tableResult"></div>
    </div>

<script>
async function testDatabaseQuery() {
    const res = document.getElementById('dbResult');
    res.innerHTML = '<p>Testing database...</p>';
    
    try {
        const response = await fetch('/test-api.php');
        const html = await response.text();
        res.innerHTML = html;
    } catch (e) {
        res.innerHTML = `<p class="error">❌ Error: ${e.message}</p>`;
    }
}

async function testAPI() {
    const res = document.getElementById('apiResult');
    res.innerHTML = '<p>🔄 Testing API...</p>';
    
    try {
        const response = await fetch('/api/admin/notifications', {
            headers: { 'Accept': 'application/json' },
            credentials: 'same-origin'
        });
        
        const data = await response.json();
        
        let html = `<h3>API Response Status: ${response.status}</h3>`;
        html += `<p><strong>Total Records:</strong> ${data.total || 0}</p>`;
        html += `<p><strong>Returned Count:</strong> ${(data.data || []).length}</p>`;
        html += `<p><strong>Current Page:</strong> ${data.current_page}</p>`;
        html += `<p><strong>Last Page:</strong> ${data.last_page}</p>`;
        
        if (data.data && data.data.length > 0) {
            html += `<h4 class="success">✅ API returned ${data.data.length} notifications!</h4>`;
            html += '<h4>Sample Data:</h4><pre>';
            data.data.slice(0, 3).forEach(n => {
                html += `ID: ${n.id}, Type: ${n.type}, Title: ${n.title}\n`;
            });
            html += '</pre>';
        } else {
            html += `<p class="error">❌ API returned 0 notifications</p>`;
        }
        
        html += '<h4>Full Response:</h4><pre>' + JSON.stringify(data, null, 2) + '</pre>';
        res.innerHTML = html;
        
    } catch (e) {
        res.innerHTML = `<p class="error">❌ Error: ${e.message}</p>`;
    }
}

async function viewLogs() {
    const res = document.getElementById('logsResult');
    res.innerHTML = '<p>Fetching logs...</p>';
    
    try {
        const response = await fetch('/get-debug-logs.php');
        const html = await response.text();
        res.innerHTML = html;
    } catch (e) {
        res.innerHTML = `<p class="error">❌ Error: ${e.message}</p>`;
    }
}

async function getTableInfo() {
    const res = document.getElementById('tableResult');
    res.innerHTML = '<p>Fetching table info...</p>';
    
    try {
        const response = await fetch('/table-info.php');
        const html = await response.text();
        res.innerHTML = html;
    } catch (e) {
        res.innerHTML = `<p class="error">❌ Error: ${e.message}</p>`;
    }
}

// Auto-run tests on load
console.log('Debug panel loaded. Click buttons to test.');
</script>
</body>
</html>
